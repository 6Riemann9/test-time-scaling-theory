[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-theory"
version = "0.9.0"
description = "Test-Time Scaling Phase Transitions, Exact Order-Statistic Integrals, and Calibrated Verification"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
real = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "sympy>=1.12",
    "huggingface_hub>=0.20",
    "requests>=2.28",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
